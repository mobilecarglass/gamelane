name: Scan games

on:
  push:
    branches: [main, master]
    paths:
      - 'games/**'
      - 'scan-games.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan games folder
        run: |
          node scan-games.js
          echo "----- games.json -----"
          cat games.json

      - name: Commit updated games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          if git diff --staged --quiet; then
            echo "No changes to games.json"
          else
            git commit -m "chore: update games.json"
            git push
          fi
