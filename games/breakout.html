<!--
  title: Breakout
  description: Break all the bricks with your paddle and ball. Don't let the ball fall!
  tags: arcade, classic
  thumbnail: games/thumbs/breakout.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Breakout — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #f0f3f6;
      --muted: #8b949e;
      --accent: #8b5cf6;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    a.back {
      position: fixed; top: 1.1rem; left: 1.1rem;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      z-index: 10; transition: color 0.2s;
    }
    a.back:hover { color: var(--accent); }
    .hud {
      display: flex; gap: 1.75rem; margin-bottom: 1rem; font-size: 0.95rem;
    }
    .hud span { color: var(--muted); }
    .hud strong { font-weight: 600; }
    .board-wrap {
      position: relative;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 94vw;
      max-height: 78vh;
      touch-action: none;
    }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(15,17,23,0.78);
      backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.35rem; }
    .overlay p { color: var(--muted); margin-bottom: 1.2rem; }
    .btn {
      padding: 0.6rem 1.5rem;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white; border: none; border-radius: 999px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 20px rgba(139,92,246,0.4);
    }
    .hint { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); opacity: 0.85; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <div class="hud">
    <div>Score <strong id="score">0</strong></div>
    <div>Lives <strong id="lives">3</strong></div>
  </div>
  <div class="board-wrap">
    <canvas id="c" width="560" height="420"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="otitle">Breakout</h2>
      <p id="omsg">Move to start</p>
      <button class="btn" id="btn">Play</button>
    </div>
  </div>
  <p class="hint">Mouse / Touch / ← → keys</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    let paddle, ball, bricks, score, lives, over, started, particles;
    const rows = 5, cols = 10;
    const bw = W / cols, bh = 20;
    const colors = ['#8b5cf6','#a78bfa','#22d3ee','#f472b6','#fbbf24'];

    function initBricks() {
      bricks = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: c * bw + 2, y: 36 + r * (bh + 5),
            w: bw - 4, h: bh, color: colors[r], alive: true
          });
        }
      }
    }

    function reset() {
      paddle = {x: W/2 - 60, y: H - 32, w: 120, h: 14};
      ball = {x: W/2, y: H - 55, r: 9, dx: 3.8, dy: -3.8};
      score = 0; lives = 3; over = false; started = false;
      particles = [];
      initBricks();
      document.getElementById('score').textContent = 0;
      document.getElementById('lives').textContent = 3;
      show('Breakout', 'Move to start');
    }

    function show(t, m) {
      document.getElementById('otitle').textContent = t;
      document.getElementById('omsg').textContent = m;
      document.getElementById('overlay').classList.add('show');
    }
    function hide() { document.getElementById('overlay').classList.remove('show'); }

    function spawn(x, y, color) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x, y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
          life: 1, color
        });
      }
    }

    function draw() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, W, H);

      // bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        // subtle highlight
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
      });

      // paddle
      const pg = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
      pg.addColorStop(0, '#7c3aed');
      pg.addColorStop(0.5, '#8b5cf6');
      pg.addColorStop(1, '#a78bfa');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      // ball glow
      const g = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, 14);
      g.addColorStop(0, 'rgba(240,243,246,0.5)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f0f3f6';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

      // particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function update() {
      if (!started || over) return;
      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x < ball.r || ball.x > W - ball.r) ball.dx *= -1;
      if (ball.y < ball.r) ball.dy *= -1;

      // paddle
      if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        ball.dy = -Math.abs(ball.dy);
        const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
        ball.dx = hit * 5.5;
      }

      bricks.forEach(b => {
        if (!b.alive) return;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          ball.dy *= -1;
          score += 10;
          document.getElementById('score').textContent = score;
          spawn(b.x + b.w/2, b.y + b.h/2, b.color);
        }
      });

      if (bricks.every(b => !b.alive)) {
        over = true;
        show('You Win!', `Score: ${score}`);
      }

      if (ball.y > H + 10) {
        lives--;
        document.getElementById('lives').textContent = lives;
        if (lives <= 0) {
          over = true;
          show('Game Over', `Score: ${score}`);
        } else {
          ball = {x: W/2, y: H-55, r:9, dx: 3.8*(Math.random()>0.5?1:-1), dy:-3.8};
        }
      }

      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.045;
        return p.life > 0;
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function start() {
      if (over) reset();
      started = true;
      hide();
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scale = W / rect.width;
      paddle.x = (e.clientX - rect.left) * scale - paddle.w/2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
      if (!started) start();
    });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scale = W / rect.width;
      paddle.x = (e.touches[0].clientX - rect.left) * scale - paddle.w/2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
      if (!started) start();
    }, {passive:false});
    canvas.addEventListener('touchstart', () => { if (!started || over) start(); }, {passive:true});

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') paddle.x = Math.max(0, paddle.x - 24);
      if (e.key === 'ArrowRight') paddle.x = Math.min(W - paddle.w, paddle.x + 24);
      if (!started || over) start();
    });
    document.getElementById('btn').addEventListener('click', start);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
