<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- grid dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="160" cy="40" r="2"/><circle cx="200" cy="40" r="2"/><circle cx="240" cy="40" r="2"/>
    <circle cx="280" cy="40" r="2"/><circle cx="320" cy="40" r="2"/><circle cx="360" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/>
    <circle cx="160" cy="80" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="240" cy="80" r="2"/>
    <circle cx="280" cy="80" r="2"/><circle cx="320" cy="80" r="2"/><circle cx="360" cy="80" r="2"/>
    <circle cx="40" cy="120" r="2"/><circle cx="80" cy="120" r="2"/><circle cx="120" cy="120" r="2"/>
    <circle cx="160" cy="120" r="2"/><circle cx="200" cy="120" r="2"/><circle cx="240" cy="120" r="2"/>
    <circle cx="280" cy="120" r="2"/><circle cx="320" cy="120" r="2"/><circle cx="360" cy="120" r="2"/>
    <circle cx="40" cy="160" r="2"/><circle cx="80" cy="160" r="2"/><circle cx="120" cy="160" r="2"/>
    <circle cx="160" cy="160" r="2"/><circle cx="200" cy="160" r="2"/><circle cx="240" cy="160" r="2"/>
    <circle cx="280" cy="160" r="2"/><circle cx="320" cy="160" r="2"/><circle cx="360" cy="160" r="2"/>
    <circle cx="40" cy="200" r="2"/><circle cx="80" cy="200" r="2"/><circle cx="120" cy="200" r="2"/>
    <circle cx="160" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="240" cy="200" r="2"/>
    <circle cx="280" cy="200" r="2"/><circle cx="320" cy="200" r="2"/><circle cx="360" cy="200" r="2"/>
  </g>
  <!-- snake body -->
  <rect x="80" y="110" width="28" height="28" rx="6" fill="url(#snake)"/>
  <rect x="112" y="110" width="28" height="28" rx="6" fill="url(#snake)" opacity="0.9"/>
  <rect x="144" y="110" width="28" height="28" rx="6" fill="url(#snake)" opacity="0.8"/>
  <rect x="176" y="110" width="28" height="28" rx="6" fill="url(#snake)" opacity="0.7"/>
  <rect x="208" y="110" width="28" height="28" rx="6" fill="url(#snake)" opacity="0.6"/>
  <rect x="240" y="110" width="28" height="28" rx="6" fill="url(#snake)" opacity="0.5"/>
  <!-- head -->
  <rect x="48" y="110" width="28" height="28" rx="6" fill="#c4b5fd"/>
  <circle cx="58" cy="118" r="3" fill="#0f1117"/>
  <!-- food -->
  <circle cx="300" cy="124" r="12" fill="#22d3ee"/>
  <circle cx="300" cy="124" r="6" fill="#67e8f9" opacity="0.6"/>
  <text x="200" y="220" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Snake</text>
</svg>
