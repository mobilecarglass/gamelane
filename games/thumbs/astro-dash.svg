<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="40" cy="30" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="120" cy="50" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="300" cy="25" r="1.5" fill="#fff" opacity="0.35"/>
  <circle cx="350" cy="60" r="1" fill="#fff" opacity="0.25"/>
  <circle cx="80" cy="80" r="1" fill="#fff" opacity="0.3"/>
  <!-- lane lines -->
  <line x1="100" y1="0" x2="100" y2="250" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="200" y1="0" x2="200" y2="250" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="2"/>
  <line x1="300" y1="0" x2="300" y2="250" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="2"/>
  <!-- crate -->
  <rect x="165" y="40" width="50" height="40" rx="4" fill="#334155" stroke="#64748b"/>
  <rect x="172" y="50" width="36" height="5" fill="#f59e0b"/>
  <rect x="172" y="62" width="36" height="5" fill="#f59e0b"/>
  <!-- energy orb -->
  <circle cx="300" cy="100" r="14" fill="#22d3ee" opacity="0.3"/>
  <circle cx="300" cy="100" r="8" fill="#22d3ee"/>
  <circle cx="297" cy="97" r="3" fill="#a5f3fc"/>
  <!-- astronaut -->
  <ellipse cx="200" cy="195" rx="16" ry="5" fill="#000" opacity="0.25"/>
  <rect x="184" y="155" width="32" height="36" rx="10" fill="#e2e8f0"/>
  <rect x="188" y="158" width="24" height="13" rx="5" fill="url(#visor)"/>
  <rect x="180" y="165" width="7" height="20" rx="2" fill="#94a3b8"/>
  <rect x="213" y="165" width="7" height="20" rx="2" fill="#94a3b8"/>
  <rect x="188" y="188" width="9" height="12" rx="2" fill="#cbd5e1"/>
  <rect x="203" y="188" width="9" height="12" rx="2" fill="#cbd5e1"/>
  <rect x="187" y="198" width="11" height="6" rx="2" fill="#8b5cf6"/>
  <rect x="202" y="198" width="11" height="6" rx="2" fill="#8b5cf6"/>
  <text x="200" y="235" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Astro Dash</text>
</svg>
