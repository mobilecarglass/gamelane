<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <!-- pipes -->
  <rect x="280" y="0" width="50" height="80" rx="4" fill="#22d3ee"/>
  <rect x="280" y="160" width="50" height="90" rx="4" fill="#22d3ee"/>
  <rect x="100" y="0" width="50" height="50" rx="4" fill="#22d3ee" opacity="0.7"/>
  <rect x="100" y="130" width="50" height="120" rx="4" fill="#22d3ee" opacity="0.7"/>
  <!-- bird -->
  <circle cx="180" cy="110" r="18" fill="#fbbf24"/>
  <circle cx="188" cy="104" r="4" fill="#0f1117"/>
  <ellipse cx="170" cy="118" rx="8" ry="5" fill="#f59e0b"/>
  <text x="200" y="230" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Flappy Bird</text>
</svg>
