<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Ring Rumble — GameLane</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06080d;color:#f0f3f6;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
a.back{position:fixed;top:12px;left:12px;color:#8b949e;text-decoration:none;font-size:.85rem;z-index:20;padding:6px 10px;background:rgba(0,0,0,.35);border-radius:8px}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0a0e17;max-width:100vw;max-height:100vh}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,8,13,.88);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10;text-align:center;padding:1.5rem}
.overlay.show{opacity:1;pointer-events:auto}
.btn{padding:.7rem 1.8rem;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:none;border-radius:999px;font-size:1rem;font-weight:600;cursor:pointer;margin:4px}
.hint{position:fixed;bottom:12px;font-size:.75rem;color:#6b7280;width:100%;text-align:center}
.controls{position:fixed;bottom:40px;left:0;right:0;display:none;justify-content:center;gap:12px;z-index:12}
.controls button{width:64px;height:64px;border-radius:16px;border:1px solid #30363d;background:rgba(0,0,0,.5);color:#fff;font-size:1.2rem;font-weight:700}
@media(pointer:coarse){.controls{display:flex}}
</style>
</head>
<body>
<a class="back" href="../index.html">← GameLane</a>
<div id="wrap">
<canvas id="c" width="640" height="360"></canvas>
<div class="overlay show" id="ov"><h2 id="ot">Ring Rumble</h2><p id="om">A/D move · J punch · K kick · L block</p><button class="btn" id="btn">Start Playing</button></div>
</div>
<div class="controls">
  <button id="bL">←</button><button id="bP">P</button><button id="bK">K</button><button id="bB">B</button><button id="bR">→</button>
</div>
<p class="hint">A/D move · J punch · K kick · L block</p>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let p1,p2,started,over,msg,keys={};

function fighter(x,color,face){
  return {x,y:H-80,w:40,h:70,vx:0,hp:100,color,face,punch:0,kick:0,block:0,hit:0,cooldown:0};
}
function reset(){
  p1=fighter(140,'#22d3ee',1);
  p2=fighter(480,'#f472b6',-1);
  started=false;over=false;msg='';
  show('Ring Rumble','A/D move · J punch · K kick · L block');
}
function show(t,m){document.getElementById('ot').textContent=t;document.getElementById('om').textContent=m;document.getElementById('ov').classList.add('show')}
function hide(){document.getElementById('ov').classList.remove('show')}

function drawF(f){
  if(f.hit>0) ctx.globalAlpha=0.7;
  ctx.fillStyle=f.color;
  // body
  ctx.beginPath();ctx.roundRect(f.x-f.w/2,f.y-f.h,f.w,f.h,10);ctx.fill();
  // head
  ctx.beginPath();ctx.arc(f.x,f.y-f.h-12,14,0,Math.PI*2);ctx.fill();
  // arm punch
  if(f.punch>0){
    ctx.fillStyle='#fbbf24';
    ctx.fillRect(f.x+f.face*10,f.y-f.h+20,f.face*36,10);
  }
  if(f.kick>0){
    ctx.fillStyle='#fbbf24';
    ctx.fillRect(f.x+f.face*5,f.y-20,f.face*40,12);
  }
  if(f.block>0){
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.strokeRect(f.x+f.face*8-6,f.y-f.h+10,12,40);
  }
  ctx.globalAlpha=1;
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1e1b4b');g.addColorStop(1,'#0f172a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // floor
  ctx.fillStyle='#1e293b';ctx.fillRect(0,H-40,W,40);
  ctx.fillStyle='#334155';ctx.fillRect(40,H-48,W-80,10);
  // HP bars
  ctx.fillStyle='#333';ctx.fillRect(30,20,200,16);ctx.fillRect(W-230,20,200,16);
  ctx.fillStyle='#22d3ee';ctx.fillRect(30,20,2*p1.hp,16);
  ctx.fillStyle='#f472b6';ctx.fillRect(W-230+(200-2*p2.hp),20,2*p2.hp,16);
  drawF(p1);drawF(p2);
  if(over){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,W,H);
  }
}

function dist(){return Math.abs(p1.x-p2.x)}

function attack(a,b,type){
  if(a.cooldown>0)return;
  if(type==='punch'){a.punch=12;a.cooldown=18}
  else {a.kick=14;a.cooldown=24}
  if(dist()<70){
    if(b.block>0){b.hp=Math.max(0,b.hp-3);b.hit=8}
    else {
      b.hp=Math.max(0,b.hp-(type==='punch'?8:12));
      b.hit=12;
      b.x+=a.face*18;
    }
  }
}

function update(){
  if(!started||over)return;
  // p1 controls
  p1.vx=0;
  if(keys['a']||keys['ArrowLeft']) p1.vx=-4;
  if(keys['d']||keys['ArrowRight']) p1.vx=4;
  p1.block=(keys['l']||keys['L'])?1:0;
  if((keys['j']||keys['J'])&&p1.punch===0) attack(p1,p2,'punch');
  if((keys['k']||keys['K'])&&p1.kick===0) attack(p1,p2,'kick');
  p1.x=Math.max(50,Math.min(W-50,p1.x+p1.vx));

  // simple AI for p2
  const d=p2.x-p1.x;
  if(Math.abs(d)>65) p2.x+=d>0?-2.2:2.2;
  else {
    if(Math.random()<0.04) attack(p2,p1,Math.random()<0.6?'punch':'kick');
    if(Math.random()<0.02) p2.block=15;
  }
  p2.x=Math.max(50,Math.min(W-50,p2.x));

  [p1,p2].forEach(f=>{
    if(f.punch>0)f.punch--;
    if(f.kick>0)f.kick--;
    if(f.hit>0)f.hit--;
    if(f.cooldown>0)f.cooldown--;
    if(f.block>1)f.block--;
  });

  // face each other
  p1.face=p1.x<p2.x?1:-1;
  p2.face=p2.x<p1.x?1:-1;

  if(p1.hp<=0){over=true;show('Defeat','Rival wins');}
  if(p2.hp<=0){over=true;show('KO!','You win');}
}

function loop(){update();draw();requestAnimationFrame(loop)}
function start(){if(over)reset();started=true;hide()}
window.addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(!started||over)start()});
window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});
document.getElementById('btn').onclick=start;
document.getElementById('bL').ontouchstart=e=>{e.preventDefault();keys['a']=true};
document.getElementById('bL').ontouchend=()=>{keys['a']=false};
document.getElementById('bR').ontouchstart=e=>{e.preventDefault();keys['d']=true};
document.getElementById('bR').ontouchend=()=>{keys['d']=false};
document.getElementById('bP').ontouchstart=e=>{e.preventDefault();keys['j']=true;setTimeout(()=>keys['j']=false,100)};
document.getElementById('bK').ontouchstart=e=>{e.preventDefault();keys['k']=true;setTimeout(()=>keys['k']=false,100)};
document.getElementById('bB').ontouchstart=e=>{e.preventDefault();keys['l']=true};
document.getElementById('bB').ontouchend=()=>{keys['l']=false};
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
