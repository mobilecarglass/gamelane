<!--
  title: Snake
  description: Classic snake game. Eat the food, grow longer, don't hit the walls or yourself.
  tags: arcade, classic
  thumbnail: games/thumbs/snake.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Snake — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #f0f3f6;
      --muted: #8b949e;
      --accent: #8b5cf6;
      --accent2: #22d3ee;
      --snake: #a78bfa;
      --food: #22d3ee;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    a.back {
      position: fixed; top: 1.1rem; left: 1.1rem;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      display: flex; align-items: center; gap: 0.35rem;
      z-index: 10; transition: color 0.2s;
    }
    a.back:hover { color: var(--accent); }
    .hud {
      display: flex; align-items: center; gap: 1.5rem;
      margin-bottom: 1rem; font-size: 0.95rem;
    }
    .hud span { color: var(--muted); }
    .hud strong { color: var(--text); font-weight: 600; }
    .board-wrap {
      position: relative;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 92vw;
      max-height: 68vh;
      image-rendering: pixelated;
    }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(15,17,23,0.78);
      backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 {
      font-size: 1.6rem; font-weight: 700; margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }
    .overlay p { color: var(--muted); margin-bottom: 1.2rem; font-size: 0.95rem; }
    .btn {
      padding: 0.6rem 1.5rem;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white; border: none; border-radius: 999px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 20px rgba(139,92,246,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(139,92,246,0.5); }
    .hint {
      margin-top: 1.1rem; font-size: 0.8rem; color: var(--muted); opacity: 0.8;
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <div class="hud">
    <div>Score <strong id="score">0</strong></div>
    <div>Best <strong id="best">0</strong></div>
  </div>
  <div class="board-wrap">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-msg">Press any key or tap to start</p>
      <button class="btn" id="start-btn">Play</button>
    </div>
  </div>
  <p class="hint">Arrow keys / WASD · Swipe on mobile · Space to pause</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const size = 20;
    const cols = canvas.width / size;
    const rows = canvas.height / size;

    let snake, dir, nextDir, food, score, best, paused, dead, started, last, particles;
    const speed = 95;
    best = +localStorage.getItem('snake-best') || 0;
    document.getElementById('best').textContent = best;

    function reset() {
      snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
      dir = {x: 1, y: 0};
      nextDir = {...dir};
      food = placeFood();
      score = 0;
      paused = false;
      dead = false;
      started = false;
      particles = [];
      document.getElementById('score').textContent = 0;
      showOverlay('Snake', 'Press any key or tap to start', true);
    }

    function placeFood() {
      let p;
      do {
        p = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
      } while (snake.some(s => s.x === p.x && s.y === p.y));
      return p;
    }

    function showOverlay(title, msg, showBtn) {
      document.getElementById('overlay-title').textContent = title;
      document.getElementById('overlay-msg').textContent = msg;
      document.getElementById('start-btn').style.display = showBtn ? 'inline-block' : 'none';
      document.getElementById('overlay').classList.add('show');
    }
    function hideOverlay() {
      document.getElementById('overlay').classList.remove('show');
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x * size + size/2,
          y: y * size + size/2,
          vx: (Math.random()-0.5)*4,
          vy: (Math.random()-0.5)*4,
          life: 1,
          color
        });
      }
    }

    function drawRounded(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function draw() {
      // background
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        ctx.beginPath(); ctx.moveTo(i*size, 0); ctx.lineTo(i*size, canvas.height); ctx.stroke();
      }
      for (let i = 0; i <= rows; i++) {
        ctx.beginPath(); ctx.moveTo(0, i*size); ctx.lineTo(canvas.width, i*size); ctx.stroke();
      }

      // food with glow
      const fx = food.x * size + size/2;
      const fy = food.y * size + size/2;
      const grd = ctx.createRadialGradient(fx, fy, 2, fx, fy, 14);
      grd.addColorStop(0, '#67e8f9');
      grd.addColorStop(0.5, '#22d3ee');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(fx, fy, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath(); ctx.arc(fx, fy, 7, 0, Math.PI*2); ctx.fill();

      // snake
      snake.forEach((s, i) => {
        const t = i / Math.max(snake.length-1, 1);
        const alpha = 1 - t * 0.45;
        ctx.fillStyle = i === 0 ? '#c4b5fd' : `rgba(167, 139, 250, ${alpha})`;
        const pad = i === 0 ? 1.5 : 2.5;
        drawRounded(s.x*size + pad, s.y*size + pad, size - pad*2, size - pad*2, 5);
        if (i === 0) {
          // eyes
          ctx.fillStyle = '#0f1117';
          const ex = dir.x !== 0 ? dir.x * 4 : 0;
          const ey = dir.y !== 0 ? dir.y * 4 : 0;
          ctx.beginPath(); ctx.arc(s.x*size + size/2 - 4 + ex, s.y*size + size/2 - 3 + ey, 2.2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(s.x*size + size/2 + 4 + ex, s.y*size + size/2 - 3 + ey, 2.2, 0, Math.PI*2); ctx.fill();
        }
      });

      // particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function update() {
      if (!started || paused || dead) return;

      dir = {...nextDir};
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        dead = true;
        if (score > best) {
          best = score;
          localStorage.setItem('snake-best', best);
          document.getElementById('best').textContent = best;
        }
        showOverlay('Game Over', `Score: ${score}`, true);
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score').textContent = score;
        spawnParticles(food.x, food.y, '#22d3ee');
        food = placeFood();
      } else {
        snake.pop();
      }

      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        return p.life > 0;
      });
    }

    function loop(t) {
      if (t - last > speed) {
        update();
        last = t;
      }
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      if (dead) reset();
      started = true;
      dead = false;
      hideOverlay();
    }

    const keyMap = {
      ArrowUp: {x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
      w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
    };

    window.addEventListener('keydown', e => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === ' ') { if (started && !dead) paused = !paused; return; }
      const nd = keyMap[k];
      if (nd && (nd.x !== -dir.x || nd.y !== -dir.y)) nextDir = nd;
      if (!started || dead) startGame();
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    canvas.addEventListener('click', () => { if (!started || dead) startGame(); });

    // swipe
    let tx, ty;
    canvas.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
      if (!started || dead) startGame();
    }, {passive:true});
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && dir.x !== -1) nextDir = {x:1,y:0};
        else if (dx < 0 && dir.x !== 1) nextDir = {x:-1,y:0};
      } else {
        if (dy > 0 && dir.y !== -1) nextDir = {x:0,y:1};
        else if (dy < 0 && dir.y !== 1) nextDir = {x:0,y:-1};
      }
    }, {passive:true});

    reset();
    last = 0;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
