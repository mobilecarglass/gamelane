<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    .score { color: #8888a0; margin-bottom: 1rem; font-size: 0.95rem; }
    canvas {
      background: #12121a;
      border-radius: 12px;
      border: 1px solid #1e1e2e;
      max-width: 95vw;
      max-height: 70vh;
      image-rendering: pixelated;
    }
    .hint { margin-top: 1rem; font-size: 0.85rem; color: #666; }
    a.back {
      position: fixed; top: 1rem; left: 1rem;
      color: #8888a0; text-decoration: none; font-size: 0.9rem;
    }
    a.back:hover { color: #7c5cfc; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <h1>Snake</h1>
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <p class="hint">Arrow keys or WASD · Space to pause</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const size = 20;
    const cols = canvas.width / size;
    const rows = canvas.height / size;

    let snake = [{x: 10, y: 10}];
    let dir = {x: 1, y: 0};
    let food = placeFood();
    let score = 0;
    let paused = false;
    let gameOver = false;
    let last = 0;
    const speed = 100;

    function placeFood() {
      let p;
      do {
        p = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
      } while (snake.some(s => s.x === p.x && s.y === p.y));
      return p;
    }

    function draw() {
      ctx.fillStyle = '#12121a';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // food
      ctx.fillStyle = '#00d4aa';
      ctx.beginPath();
      ctx.roundRect(food.x*size+2, food.y*size+2, size-4, size-4, 4);
      ctx.fill();

      // snake
      snake.forEach((s,i) => {
        ctx.fillStyle = i === 0 ? '#7c5cfc' : '#a78bfa';
        ctx.beginPath();
        ctx.roundRect(s.x*size+1, s.y*size+1, size-2, size-2, 4);
        ctx.fill();
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
        ctx.font = '16px system-ui';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Press R to restart', canvas.width/2, canvas.height/2 + 25);
      }
    }

    function update() {
      if (paused || gameOver) return;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver = true;
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('score').textContent = score;
        food = placeFood();
      } else {
        snake.pop();
      }
    }

    function loop(t) {
      if (t - last > speed) {
        update();
        draw();
        last = t;
      }
      requestAnimationFrame(loop);
    }

    const keyMap = {
      ArrowUp: {x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
      w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
    };

    window.addEventListener('keydown', e => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === ' ' ) { paused = !paused; return; }
      if (k === 'r' && gameOver) {
        snake = [{x:10,y:10}]; dir = {x:1,y:0}; food = placeFood();
        score = 0; gameOver = false;
        document.getElementById('score').textContent = 0;
        return;
      }
      const nd = keyMap[k];
      if (nd && (nd.x !== -dir.x || nd.y !== -dir.y)) dir = nd;
    });

    // touch / swipe
    let tx, ty;
    canvas.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, {passive:true});
    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30 && dir.x !== -1) dir = {x:1,y:0};
        else if (dx < -30 && dir.x !== 1) dir = {x:-1,y:0};
      } else {
        if (dy > 30 && dir.y !== -1) dir = {x:0,y:1};
        else if (dy < -30 && dir.y !== 1) dir = {x:0,y:-1};
      }
    }, {passive:true});

    requestAnimationFrame(loop);
  </script>
</body>
</html>
