<!--
  title: Memory Match
  description: Flip cards and find matching pairs. How fast can you clear the board?
  tags: puzzle, casual
  thumbnail: games/thumbs/memory.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0b0d12; color: #f0f3f6;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    a.back {
      position: fixed; top: 1rem; left: 1rem; color: #8b949e;
      text-decoration: none; font-size: 0.9rem; z-index: 10;
    }
    a.back:hover { color: #8b5cf6; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .hud { color: #8b949e; font-size: 1rem; margin-bottom: 1.5rem; }
    .hud strong { color: #f0f3f6; font-size: 1.2rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      max-width: 560px;
      width: 100%;
    }
    .card {
      aspect-ratio: 1; perspective: 900px; cursor: pointer;
      border: none; background: transparent; padding: 0;
    }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      border-radius: 16px; backface-visibility: hidden;
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      border: 1px solid #2a2f3a;
    }
    .face.back {
      background: linear-gradient(160deg, #1a1f2a, #12151c);
      color: #484f58; font-size: 1.3rem; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .face.front {
      background: #161b22;
      transform: rotateY(180deg);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.3), 0 8px 24px rgba(0,0,0,0.3);
    }
    .card.matched .face.front {
      border-color: #22d3ee;
      box-shadow: 0 0 0 1px rgba(34,211,238,0.35);
      opacity: 0.8;
    }
    .win {
      margin-top: 1.75rem; text-align: center; display: none;
    }
    .win.show { display: block; }
    .win h2 { font-size: 1.35rem; color: #22d3ee; margin-bottom: 0.9rem; }
    .btn {
      padding: 0.65rem 1.6rem; background: linear-gradient(135deg,#8b5cf6,#7c3aed);
      color: white; border: none; border-radius: 999px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; box-shadow: 0 6px 22px rgba(139,92,246,0.4);
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <h1>Memory Match</h1>
  <div class="hud">Moves <strong id="moves">0</strong></div>
  <div class="board" id="board"></div>
  <div class="win" id="win">
    <h2>Nice work!</h2>
    <button class="btn" id="restart">Play again</button>
  </div>

  <script>
    const emojis = ['🦊','🐸','🦉','🐙','🦋','🐬','🦄','🐨'];
    let cards, flipped, matched, moves, lock;

    function shuffle(arr) {
      for (let i = arr.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function init() {
      cards = shuffle([...emojis, ...emojis]);
      flipped = []; matched = 0; moves = 0; lock = false;
      document.getElementById('moves').textContent = 0;
      document.getElementById('win').classList.remove('show');

      const board = document.getElementById('board');
      board.innerHTML = cards.map((e,i) => `
        <button class="card" data-idx="${i}" aria-label="Card">
          <div class="card-inner">
            <div class="face back">?</div>
            <div class="face front">${e}</div>
          </div>
        </button>
      `).join('');

      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => flip(card));
      });
    }

    function flip(card) {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        moves++; document.getElementById('moves').textContent = moves;
        lock = true;
        const [a,b] = flipped;
        const ea = a.querySelector('.front').textContent;
        const eb = b.querySelector('.front').textContent;

        if (ea === eb) {
          setTimeout(() => {
            a.classList.add('matched'); b.classList.add('matched');
            matched += 2; flipped = []; lock = false;
            if (matched === cards.length) document.getElementById('win').classList.add('show');
          }, 300);
        } else {
          setTimeout(() => {
            a.classList.remove('flipped'); b.classList.remove('flipped');
            flipped = []; lock = false;
          }, 700);
        }
      }
    }

    document.getElementById('restart').addEventListener('click', init);
    init();
  </script>
</body>
</html>
