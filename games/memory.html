<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: system-ui, sans-serif;
      padding: 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .info { color: #8888a0; margin-bottom: 1.25rem; font-size: 0.95rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 420px;
      width: 100%;
    }
    .card {
      aspect-ratio: 1;
      background: #1a1a26;
      border: 1px solid #2a2a3d;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      cursor: pointer;
      transition: transform 0.25s, background 0.25s, border-color 0.25s;
      user-select: none;
      position: relative;
    }
    .card.flipped, .card.matched {
      background: #12121a;
      border-color: #7c5cfc;
    }
    .card.matched {
      border-color: #00d4aa;
      opacity: 0.7;
      cursor: default;
    }
    .card .front { display: none; }
    .card.flipped .front, .card.matched .front { display: block; }
    .card .back { font-size: 1.2rem; opacity: 0.4; }
    .card.flipped .back, .card.matched .back { display: none; }
    .card:active:not(.matched) { transform: scale(0.95); }
    .win {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      color: #00d4aa;
      display: none;
    }
    button {
      margin-top: 1rem;
      padding: 0.55rem 1.4rem;
      background: #7c5cfc;
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
      display: none;
    }
    button:hover { background: #6d4eef; }
    a.back {
      position: fixed; top: 1rem; left: 1rem;
      color: #8888a0; text-decoration: none; font-size: 0.9rem;
    }
    a.back:hover { color: #7c5cfc; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <h1>Memory Match</h1>
  <div class="info">Moves: <span id="moves">0</span></div>
  <div class="board" id="board"></div>
  <div class="win" id="win">You won!</div>
  <button id="restart">Play again</button>

  <script>
    const emojis = ['🦊','🐸','🦉','🐙','🦋','🐬','🦄','🐨'];
    let cards = [...emojis, ...emojis];
    let flipped = [];
    let matched = 0;
    let moves = 0;
    let lock = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function init() {
      cards = shuffle([...emojis, ...emojis]);
      flipped = [];
      matched = 0;
      moves = 0;
      lock = false;
      document.getElementById('moves').textContent = 0;
      document.getElementById('win').style.display = 'none';
      document.getElementById('restart').style.display = 'none';

      const board = document.getElementById('board');
      board.innerHTML = cards.map((e, i) => `
        <div class="card" data-idx="${i}">
          <span class="front">${e}</span>
          <span class="back">?</span>
        </div>
      `).join('');

      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => flip(card));
      });
    }

    function flip(card) {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        lock = true;
        const [a, b] = flipped;
        const ea = a.querySelector('.front').textContent;
        const eb = b.querySelector('.front').textContent;

        if (ea === eb) {
          a.classList.add('matched');
          b.classList.add('matched');
          matched += 2;
          flipped = [];
          lock = false;
          if (matched === cards.length) {
            document.getElementById('win').style.display = 'block';
            document.getElementById('restart').style.display = 'inline-block';
          }
        } else {
          setTimeout(() => {
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            flipped = [];
            lock = false;
          }, 700);
        }
      }
    }

    document.getElementById('restart').addEventListener('click', init);
    init();
  </script>
</body>
</html>
