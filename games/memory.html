<!--
  title: Memory Match
  description: Flip cards and find matching pairs. How fast can you clear the board?
  tags: puzzle, casual
  thumbnail: games/thumbs/memory.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Memory Match — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06080d; color: #f0f3f6; font-family: system-ui, sans-serif; user-select: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
    a.back { position: fixed; top: 12px; left: 12px; color: #8b949e; text-decoration: none; font-size: 0.85rem; z-index: 20; padding: 6px 10px; background: rgba(0,0,0,0.35); border-radius: 8px; backdrop-filter: blur(6px); }
    a.back:hover { color: #a78bfa; }
    .topbar { position: fixed; top: 12px; right: 12px; left: 12px; display: flex; justify-content: center; z-index: 15; pointer-events: none; }
    .topbar .stat { text-align: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
    .topbar span { display: block; font-size: 0.7rem; color: #8b949e; }
    .topbar strong { font-size: 1.35rem; font-weight: 700; }
    h1 { font-size: clamp(1.3rem, 4vw, 1.6rem); font-weight: 700; margin-bottom: 1rem; margin-top: 3rem; }
    .board {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      width: min(92vw, 92vh, 520px);
    }
    @media (orientation: landscape) {
      .board { width: min(70vh, 520px); }
    }
    .card {
      aspect-ratio: 1; perspective: 900px; cursor: pointer;
      border: none; background: transparent; padding: 0;
    }
    .card-inner {
      position: relative; width: 100%; height: 100%;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; display: grid; place-items: center;
      border-radius: 14px; backface-visibility: hidden;
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      border: 1px solid #2a2f3a;
    }
    .face.back {
      background: linear-gradient(160deg, #1a1f2a, #0f131c);
      color: #484f58; font-size: 1.2rem; font-weight: 600;
    }
    .face.front {
      background: #161b22; transform: rotateY(180deg);
      border-color: #8b5cf6;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.3), 0 8px 24px rgba(0,0,0,0.3);
    }
    .card.matched .face.front {
      border-color: #22d3ee;
      box-shadow: 0 0 0 1px rgba(34,211,238,0.35);
      opacity: 0.8;
    }
    .win {
      margin-top: 1.5rem; text-align: center; display: none;
    }
    .win.show { display: block; }
    .win h2 { font-size: 1.3rem; color: #22d3ee; margin-bottom: 0.9rem; }
    .btn-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.65rem 1.6rem; background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white; border: none; border-radius: 999px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; box-shadow: 0 6px 22px rgba(139,92,246,0.4);
    }
    .btn.secondary { background: transparent; border: 1px solid #30363d; box-shadow: none; color: #e2e8f0; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <div class="topbar">
    <div class="stat"><span>MOVES</span><strong id="moves">0</strong></div>
  </div>
  <h1>Memory Match</h1>
  <div class="board" id="board"></div>
  <div class="win" id="win">
    <h2>Nice work!</h2>
    <div class="btn-row">
      <button class="btn" id="restart">Play again</button>
      <button class="btn secondary" id="fs-btn">Fullscreen</button>
    </div>
  </div>

  <script>
    const emojis = ['🦊','🐸','🦉','🐙','🦋','🐬','🦄','🐨'];
    let cards, flipped, matched, moves, lock;

    function shuffle(arr) {
      for (let i = arr.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function init() {
      cards = shuffle([...emojis, ...emojis]);
      flipped = []; matched = 0; moves = 0; lock = false;
      document.getElementById('moves').textContent = 0;
      document.getElementById('win').classList.remove('show');

      const board = document.getElementById('board');
      board.innerHTML = cards.map((e,i) => `
        <button class="card" data-idx="${i}" aria-label="Card">
          <div class="card-inner">
            <div class="face back">?</div>
            <div class="face front">${e}</div>
          </div>
        </button>
      `).join('');

      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => flip(card));
      });
    }

    function flip(card) {
      if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);

      if (flipped.length === 2) {
        moves++; document.getElementById('moves').textContent = moves;
        lock = true;
        const [a,b] = flipped;
        const ea = a.querySelector('.front').textContent;
        const eb = b.querySelector('.front').textContent;

        if (ea === eb) {
          setTimeout(() => {
            a.classList.add('matched'); b.classList.add('matched');
            matched += 2; flipped = []; lock = false;
            if (matched === cards.length) document.getElementById('win').classList.add('show');
          }, 300);
        } else {
          setTimeout(() => {
            a.classList.remove('flipped'); b.classList.remove('flipped');
            flipped = []; lock = false;
          }, 700);
        }
      }
    }

    document.getElementById('restart').addEventListener('click', init);
    document.getElementById('fs-btn').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) (el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);
      else (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
    });
    init();
  </script>
</body>
</html>
