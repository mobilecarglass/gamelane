<!--
  title: Astro Dash
  description: Race through a space station as an astronaut. Switch lanes, jump obstacles, collect energy orbs.
  tags: arcade, endless, action
  thumbnail: games/thumbs/astro-dash.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Astro Dash — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #06080d;
      color: #f0f3f6;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    a.back {
      position: fixed; top: 12px; left: 12px;
      color: #8b949e; text-decoration: none; font-size: 0.85rem;
      z-index: 20; padding: 6px 10px;
      background: rgba(0,0,0,0.35); border-radius: 8px;
      backdrop-filter: blur(6px);
    }
    a.back:hover { color: #a78bfa; }

    .topbar {
      position: fixed; top: 12px; right: 12px; left: 12px;
      display: flex; justify-content: center; gap: 2rem;
      z-index: 15; pointer-events: none;
    }
    .topbar .stat {
      text-align: center;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      padding: 6px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .topbar span { display: block; font-size: 0.7rem; color: #8b949e; letter-spacing: 0.06em; }
    .topbar strong { font-size: 1.35rem; font-weight: 700; }

    #game-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      background: #0a0e17;
    }

    /* Portrait phones: tall canvas */
    @media (orientation: portrait) {
      canvas {
        width: 100vw;
        height: auto;
        max-height: 100vh;
      }
    }

    /* Landscape / desktop: fill as much as possible */
    @media (orientation: landscape) {
      canvas {
        height: 100vh;
        width: auto;
        max-width: 100vw;
      }
    }

    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(6,8,13,0.88);
      backdrop-filter: blur(12px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
      text-align: center; padding: 1.5rem;
      z-index: 10;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700; margin-bottom: 0.4rem; letter-spacing: -0.02em;
    }
    .overlay p {
      color: #8b949e; margin-bottom: 1.4rem;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem); line-height: 1.5;
      max-width: 320px;
    }
    .btn {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white; border: none; border-radius: 999px;
      font-size: 1.05rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 8px 28px rgba(139,92,246,0.5);
    }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .btn.secondary {
      background: transparent;
      border: 1px solid #30363d;
      box-shadow: none;
      color: #e2e8f0;
    }
    .hint {
      position: fixed; bottom: 14px;
      font-size: 0.75rem; color: #6b7280;
      text-align: center; width: 100%;
      pointer-events: none; z-index: 5;
    }

    /* Rotate prompt for portrait on small screens */
    .rotate-hint {
      display: none;
      position: fixed; inset: 0;
      background: #06080d;
      z-index: 50;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      color: #8b949e;
    }
    .rotate-hint svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.7; }
    @media (orientation: portrait) and (max-width: 500px) {
      .rotate-hint { display: flex; }
      /* still allow play if they dismiss, but encourage landscape */
    }
    .rotate-hint.hidden { display: none !important; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>

  <div class="topbar">
    <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
    <div class="stat"><span>BEST</span><strong id="best">0</strong></div>
  </div>

  <div id="game-wrap">
    <canvas id="c" width="480" height="800"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="otitle">Astro Dash</h2>
      <p id="omsg">Race through a space station.<br>Switch lanes, jump, collect orbs.</p>
      <div class="btn-row">
        <button class="btn" id="btn">Play</button>
        <button class="btn secondary" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <p class="hint">← → lanes · ↑ jump · Swipe on mobile</p>

  <div class="rotate-hint" id="rotate-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="6" y="2" width="12" height="20" rx="2"/>
      <path d="M12 18h.01"/>
      <path d="M4 8l-2 2 2 2M20 8l2 2-2 2"/>
    </svg>
    <p style="font-size:1.1rem;color:#e2e8f0;margin-bottom:0.5rem;">Turn your phone</p>
    <p style="margin-bottom:1.25rem;">Astro Dash plays best in landscape</p>
    <button class="btn" id="dismiss-rotate" style="font-size:0.9rem;padding:0.55rem 1.4rem;">Play in portrait</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = canvas.width, H = canvas.height;

    // High-DPI
    function resizeCanvas() {
      const isLandscape = window.innerWidth > window.innerHeight;
      if (isLandscape) {
        // landscape: wider playfield
        canvas.width = 900;
        canvas.height = 500;
      } else {
        canvas.width = 480;
        canvas.height = 800;
      }
      W = canvas.width;
      H = canvas.height;
      // recompute lane positions after resize
      if (player) {
        player.targetX = laneX(player.lane);
        player.x = player.targetX;
        player.baseY = H * 0.78;
        if (player.grounded) player.y = player.baseY;
      }
    }

    const LANES = 3;
    function laneX(i) {
      if (W > H) {
        // landscape: lanes spread more
        return W * (0.28 + i * 0.22);
      }
      return W * (0.22 + i * 0.28);
    }

    let player, obstacles, orbs, particles, stars, score, best, speed, frame, started, dead, invuln;
    best = +localStorage.getItem('astro-best') || 0;
    document.getElementById('best').textContent = best;

    function reset() {
      resizeCanvas();
      player = {
        lane: 1,
        x: laneX(1),
        targetX: laneX(1),
        baseY: H * 0.78,
        y: H * 0.78,
        vy: 0,
        grounded: true,
        jumpPower: -14.5,
        gravity: 0.58,
        r: 26,
        anim: 0
      };
      obstacles = [];
      orbs = [];
      particles = [];
      stars = [];
      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.6 + Math.random() * 1.4,
          s: 0.15 + Math.random() * 0.5
        });
      }
      score = 0;
      speed = 5.8;
      frame = 0;
      obsTimer = 20;
      orbTimer = 10;
      scoreAcc = 0;
      started = false;
      dead = false;
      invuln = 0;
      document.getElementById('score').textContent = 0;
      show('Astro Dash', 'Race through a space station.<br>Switch lanes, jump, collect orbs.');
    }

    function show(t, m) {
      document.getElementById('otitle').textContent = t;
      document.getElementById('omsg').innerHTML = m;
      document.getElementById('overlay').classList.add('show');
    }
    function hide() { document.getElementById('overlay').classList.remove('show'); }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * LANES);
      const type = Math.random() < 0.6 ? 'box' : 'beam';
      obstacles.push({
        lane, type,
        y: -80,
        h: type === 'box' ? 56 : 32,
        w: type === 'box' ? 64 : 80,
        passed: false
      });
    }

    function spawnOrb() {
      orbs.push({
        lane: Math.floor(Math.random() * LANES),
        y: -40,
        r: 13,
        collected: false,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function spawnParticles(x, y, color, n = 12) {
      for (let i = 0; i < n; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 2,
          life: 1,
          r: 2 + Math.random() * 3.5,
          color
        });
      }
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0a0e1a');
      g.addColorStop(0.4, '#12102a');
      g.addColorStop(1, '#0a2a3a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // stars parallax
      stars.forEach(s => {
        s.y += s.s * (speed * 0.15);
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.fillStyle = `rgba(255,255,255,${0.15 + s.r * 0.1})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // lane guides
      ctx.strokeStyle = 'rgba(139,92,246,0.1)';
      ctx.lineWidth = 2;
      for (let i = 0; i < LANES; i++) {
        const x = laneX(i);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      // floor light
      const fg = ctx.createLinearGradient(0, H * 0.88, 0, H);
      fg.addColorStop(0, 'transparent');
      fg.addColorStop(1, 'rgba(34,211,238,0.07)');
      ctx.fillStyle = fg;
      ctx.fillRect(0, H * 0.88, W, H * 0.12);
    }

    function drawPlayer() {
      const p = player;
      p.anim += 0.2;

      ctx.save();
      ctx.translate(p.x, p.y);

      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 34, 22, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // jetpack flame when airborne
      if (!p.grounded) {
        const flame = ctx.createRadialGradient(0, 28, 2, 0, 40, 28);
        flame.addColorStop(0, 'rgba(34,211,238,0.7)');
        flame.addColorStop(0.4, 'rgba(139,92,246,0.35)');
        flame.addColorStop(1, 'transparent');
        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.arc(0, 32, 28, 0, Math.PI * 2);
        ctx.fill();
        // small particles
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath();
        ctx.arc(-4, 36 + Math.sin(p.anim*2)*3, 3, 0, Math.PI*2);
        ctx.arc(5, 38 + Math.cos(p.anim*2)*3, 2.5, 0, Math.PI*2);
        ctx.fill();
      }

      // helmet / body
      ctx.fillStyle = '#e8edf5';
      ctx.beginPath();
      ctx.roundRect(-18, -24, 36, 42, 12);
      ctx.fill();

      // chest panel
      ctx.fillStyle = '#c5cdd8';
      ctx.beginPath();
      ctx.roundRect(-10, 0, 20, 14, 4);
      ctx.fill();
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(0, 7, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // visor
      const vg = ctx.createLinearGradient(-14, -20, 14, -2);
      vg.addColorStop(0, '#22d3ee');
      vg.addColorStop(0.5, '#818cf8');
      vg.addColorStop(1, '#8b5cf6');
      ctx.fillStyle = vg;
      ctx.beginPath();
      ctx.roundRect(-14, -20, 28, 16, 7);
      ctx.fill();
      // visor shine
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.roundRect(-11, -18, 12, 5, 3);
      ctx.fill();

      // side tanks
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.roundRect(-24, -6, 9, 26, 4);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(15, -6, 9, 26, 4);
      ctx.fill();
      ctx.fillStyle = '#64748b';
      ctx.fillRect(-22, 2, 5, 8);
      ctx.fillRect(17, 2, 5, 8);

      // legs
      const leg = p.grounded ? Math.sin(p.anim) * 4 : 0;
      ctx.fillStyle = '#d1d9e6';
      ctx.beginPath();
      ctx.roundRect(-14, 16, 11, 14 + leg, 4);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(3, 16, 11, 14 - leg, 4);
      ctx.fill();

      // boots
      ctx.fillStyle = '#7c3aed';
      ctx.beginPath();
      ctx.roundRect(-15, 28 + leg, 13, 8, 3);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(2, 28 - leg, 13, 8, 3);
      ctx.fill();

      ctx.restore();
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        const x = laneX(o.lane);
        if (o.type === 'box') {
          // main crate
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.roundRect(x - o.w/2, o.y, o.w, o.h, 8);
          ctx.fill();
          // edge highlight
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 2;
          ctx.stroke();
          // warning stripes
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(x - o.w/2 + 8, o.y + 12, o.w - 16, 7);
          ctx.fillRect(x - o.w/2 + 8, o.y + 32, o.w - 16, 7);
          // bolts
          ctx.fillStyle = '#64748b';
          [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy]) => {
            ctx.beginPath();
            ctx.arc(x + dx * (o.w/2 - 10), o.y + o.h/2 + dy * 12, 3, 0, Math.PI*2);
            ctx.fill();
          });
        } else {
          // energy barrier
          const bg = ctx.createLinearGradient(x - o.w/2, 0, x + o.w/2, 0);
          bg.addColorStop(0, 'transparent');
          bg.addColorStop(0.15, 'rgba(244,63,94,0.5)');
          bg.addColorStop(0.5, '#fb7185');
          bg.addColorStop(0.85, 'rgba(244,63,94,0.5)');
          bg.addColorStop(1, 'transparent');
          ctx.fillStyle = bg;
          ctx.fillRect(x - o.w/2, o.y, o.w, o.h);
          // core line
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillRect(x - o.w/2, o.y + o.h/2 - 2, o.w, 4);
          // glow
          ctx.fillStyle = 'rgba(251,113,133,0.15)';
          ctx.beginPath();
          ctx.ellipse(x, o.y + o.h/2, o.w * 0.7, 24, 0, 0, Math.PI*2);
          ctx.fill();
        }
      });
    }

    function drawOrbs() {
      orbs.forEach(o => {
        if (o.collected) return;
        o.pulse += 0.08;
        const x = laneX(o.lane);
        const pulse = 1 + Math.sin(o.pulse) * 0.12;
        const glow = ctx.createRadialGradient(x, o.y, 2, x, o.y, 24 * pulse);
        glow.addColorStop(0, 'rgba(34,211,238,0.8)');
        glow.addColorStop(0.4, 'rgba(34,211,238,0.25)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, o.y, 24 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#22d3ee';
        ctx.beginPath();
        ctx.arc(x, o.y, o.r * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ecfeff';
        ctx.beginPath();
        ctx.arc(x - 4, o.y - 4, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function update(step = 1) {
      if (!started || dead) return;
      frame += step;
      invuln = Math.max(0, invuln - 1);

      speed = Math.min(11.0, 5.8 + frame * 0.0020);

      player.x += (player.targetX - player.x) * 0.2 * step;

      if (!player.grounded) {
        player.vy += player.gravity * step;
        player.y += player.vy * step;
        if (player.y >= player.baseY) {
          player.y = player.baseY;
          player.vy = 0;
          player.grounded = true;
        }
      }

      const spawnRate = Math.max(28, 50 - speed * 2.2);
      obsTimer += step;
      orbTimer += step;
      if (obsTimer >= spawnRate) { obsTimer = 0; spawnObstacle(); }
      if (orbTimer >= 35) { orbTimer = 0;
      scoreAcc = 0; spawnOrb(); }

      obstacles.forEach(o => o.y += speed * step);
      orbs.forEach(o => o.y += speed * step);

      scoreAcc = (scoreAcc || 0) + step;
      if (scoreAcc >= 4) {
        scoreAcc = 0;
        score += 1;
        document.getElementById('score').textContent = score;
      }

      orbs.forEach(o => {
        if (o.collected) return;
        if (o.lane === player.lane && Math.abs(o.y - player.y) < 40) {
          o.collected = true;
          score += 20;
          document.getElementById('score').textContent = score;
          spawnParticles(laneX(o.lane), o.y, '#22d3ee', 14);
        }
      });

      if (invuln <= 0) {
        for (const o of obstacles) {
          if (o.lane !== player.lane) continue;
          const ox = laneX(o.lane);
          const hitX = Math.abs(player.x - ox) < (o.w / 2 + player.r * 0.45);
          const hitY = player.y + player.r > o.y && player.y - player.r < o.y + o.h;
          if (o.type === 'box' && player.y < player.baseY - 40) continue;
          if (hitX && hitY) {
            die();
            return;
          }
        }
      }

      obstacles = obstacles.filter(o => o.y < H + 100);
      orbs = orbs.filter(o => o.y < H + 50 && !o.collected);
      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.028; p.r *= 0.97;
        return p.life > 0;
      });
    }

    function die() {
      dead = true;
      spawnParticles(player.x, player.y, '#f472b6', 20);
      if (score > best) {
        best = score;
        localStorage.setItem('astro-best', best);
        document.getElementById('best').textContent = best;
      }
      show('Crash!', `Score: ${score} &nbsp;·&nbsp; Best: ${best}`);
    }

    function jump() {
      if (!started || dead) return;
      if (player.grounded) {
        player.grounded = false;
        player.vy = player.jumpPower;
      }
    }

    function changeLane(dir) {
      if (!started || dead) return;
      player.lane = Math.max(0, Math.min(LANES - 1, player.lane + dir));
      player.targetX = laneX(player.lane);
    }

    function start() {
      if (dead) reset();
      started = true;
      dead = false;
      hide();
    }

    function draw() {
      drawBackground();
      drawObstacles();
      drawOrbs();
      drawPlayer();
      drawParticles();
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(32, now - lastTime); // cap to avoid huge jumps
      lastTime = now;
      // normalize around 60fps (16.67ms)
      const step = dt / 16.67;
      update(step);
      draw();
      requestAnimationFrame(loop);
    }

    // Controls
    window.addEventListener('keydown', e => {
      if (['ArrowLeft','a','A'].includes(e.key)) { changeLane(-1); if (!started) start(); }
      if (['ArrowRight','d','D'].includes(e.key)) { changeLane(1); if (!started) start(); }
      if (['ArrowUp','w','W',' '].includes(e.key)) { e.preventDefault(); jump(); if (!started) start(); }
      if (e.key === 'Enter' && (!started || dead)) start();
    });

    let tx, ty;
    canvas.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
      if (!started || dead) start();
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) { jump(); return; }
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 28) changeLane(1);
        else if (dx < -28) changeLane(-1);
      } else if (dy < -28) jump();
    }, { passive: true });

    document.getElementById('btn').addEventListener('click', start);
    canvas.addEventListener('click', () => { if (!started || dead) start(); });

    // Fullscreen
    document.getElementById('fs-btn').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      }
    });

    // Rotate dismiss
    document.getElementById('dismiss-rotate').addEventListener('click', () => {
      document.getElementById('rotate-hint').classList.add('hidden');
    });

    window.addEventListener('resize', () => {
      if (started && !dead) {
        // keep playing, just adjust
        const oldLane = player.lane;
        resizeCanvas();
        player.lane = oldLane;
        player.targetX = laneX(oldLane);
        player.x = player.targetX;
        player.baseY = H * 0.78;
        if (player.grounded) player.y = player.baseY;
      } else {
        reset();
      }
    });
    window.addEventListener('orientationchange', () => setTimeout(() => window.dispatchEvent(new Event('resize')), 100));

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
