<!--
  title: Flappy Bird
  description: Tap to flap through the pipes. Simple controls, hard to master.
  tags: arcade, endless
  thumbnail: games/thumbs/flappy.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Bird — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0b0d12; color: #f0f3f6;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; touch-action: none;
    }
    a.back {
      position: fixed; top: 1rem; left: 1rem; color: #8b949e;
      text-decoration: none; font-size: 0.9rem; z-index: 10;
    }
    a.back:hover { color: #8b5cf6; }
    .hud { margin-bottom: 0.9rem; }
    .hud span { color: #8b949e; font-size: 0.85rem; }
    .hud strong { font-weight: 700; font-size: 1.5rem; }
    .board-wrap {
      position: relative; border-radius: 20px;
      border: 1px solid #2a2f3a; overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      width: min(92vw, 420px);
      height: auto;
      cursor: pointer;
    }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(11,13,18,0.78); backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 { font-size: 1.7rem; font-weight: 700; margin-bottom: 0.35rem; }
    .overlay p { color: #8b949e; margin-bottom: 1.3rem; font-size: 1rem; }
    .btn {
      padding: 0.7rem 1.8rem; background: linear-gradient(135deg,#8b5cf6,#7c3aed);
      color: white; border: none; border-radius: 999px; font-size: 1rem;
      font-weight: 600; cursor: pointer; box-shadow: 0 6px 24px rgba(139,92,246,0.45);
    }
    .hint { margin-top: 1rem; font-size: 0.8rem; color: #8b949e; opacity: 0.75; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <div class="hud"><span>SCORE</span><br><strong id="score">0</strong></div>
  <div class="board-wrap">
    <canvas id="c" width="420" height="640"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="otitle">Flappy Bird</h2>
      <p id="omsg">Tap or press Space to start</p>
      <button class="btn" id="btn">Play</button>
    </div>
  </div>
  <p class="hint">Click / Tap / Space to flap</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    let bird, pipes, score, frame, started, dead, best;
    // Much easier physics
    const gravity = 0.28;
    const jump = -5.4;
    const gap = 195;
    const pipeW = 56;
    best = +localStorage.getItem('flappy-best') || 0;

    function reset() {
      bird = {x: 100, y: H/2, vy: 0, r: 18, rot: 0};
      pipes = []; score = 0; frame = 0; started = false; dead = false;
      document.getElementById('score').textContent = 0;
      show('Flappy Bird', 'Tap or press Space to start');
    }

    function show(t, m) {
      document.getElementById('otitle').textContent = t;
      document.getElementById('omsg').textContent = m;
      document.getElementById('overlay').classList.add('show');
    }
    function hide() { document.getElementById('overlay').classList.remove('show'); }

    function addPipe() {
      const top = 90 + Math.random() * (H - gap - 200);
      pipes.push({x: W + 20, top, bottom: top + gap, passed: false});
    }

    function draw() {
      // rich sky
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0f172a');
      bg.addColorStop(0.45, '#1e1b4b');
      bg.addColorStop(1, '#0c4a6e');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // stars
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      for (let i = 0; i < 24; i++) {
        const sx = (i * 89 + frame * 0.12) % W;
        const sy = (i * 47) % (H * 0.5);
        ctx.beginPath(); ctx.arc(sx, sy, 1.3, 0, Math.PI*2); ctx.fill();
      }

      // pipes
      pipes.forEach(p => {
        const pg = ctx.createLinearGradient(p.x, 0, p.x + pipeW, 0);
        pg.addColorStop(0, '#0e7490');
        pg.addColorStop(0.4, '#22d3ee');
        pg.addColorStop(1, '#06b6d4');

        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.roundRect(p.x, 0, pipeW, p.top, [0,0,10,10]); ctx.fill();
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath(); ctx.roundRect(p.x - 4, p.top - 18, pipeW + 8, 18, 4); ctx.fill();

        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.roundRect(p.x, p.bottom, pipeW, H - p.bottom, [10,10,0,0]); ctx.fill();
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath(); ctx.roundRect(p.x - 4, p.bottom, pipeW + 8, 18, 4); ctx.fill();
      });

      // ground
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, H - 10, W, 10);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, H - 10, W, 3);

      // bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rot);

      // soft glow
      const bg2 = ctx.createRadialGradient(0, 0, 2, 0, 0, 28);
      bg2.addColorStop(0, 'rgba(251,191,36,0.25)');
      bg2.addColorStop(1, 'transparent');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI*2); ctx.fill();

      // body
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 16, 0, 0, Math.PI*2); ctx.fill();
      // wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.ellipse(-6, 4, 11, 8, -0.35, 0, Math.PI*2); ctx.fill();
      // eye white
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9, -5, 6.5, 0, Math.PI*2); ctx.fill();
      // pupil
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(11, -5, 3.2, 0, Math.PI*2); ctx.fill();
      // beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(18, -1); ctx.lineTo(28, 3); ctx.lineTo(18, 7);
      ctx.closePath(); ctx.fill();

      ctx.restore();
    }

    function update() {
      if (!started || dead) return;
      frame++;
      bird.vy += gravity;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI/3.5, Math.max(-0.45, bird.vy * 0.055));

      if (frame % 120 === 0) addPipe();

      pipes.forEach(p => {
        p.x -= 1.9;
        if (!p.passed && p.x + pipeW < bird.x) {
          p.passed = true; score++;
          document.getElementById('score').textContent = score;
        }
      });
      pipes = pipes.filter(p => p.x > -pipeW - 20);

      if (bird.y + bird.r > H - 12 || bird.y - bird.r < 0) { die(); return; }
      for (const p of pipes) {
        if (bird.x + bird.r - 5 > p.x && bird.x - bird.r + 5 < p.x + pipeW) {
          if (bird.y - bird.r + 4 < p.top || bird.y + bird.r - 4 > p.bottom) {
            die(); return;
          }
        }
      }
    }

    function die() {
      dead = true;
      if (score > best) {
        best = score;
        localStorage.setItem('flappy-best', best);
      }
      show('Game Over', `Score: ${score}  ·  Best: ${best}`);
    }

    function flap() {
      if (dead) { reset(); return; }
      if (!started) { started = true; hide(); }
      bird.vy = jump;
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive:false});
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); flap(); }
    });
    document.getElementById('btn').addEventListener('click', flap);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
