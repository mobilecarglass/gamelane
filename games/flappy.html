<!--
  title: Flappy Bird
  description: Tap to flap through the pipes. Simple controls, hard to master.
  tags: arcade, endless
  thumbnail: games/thumbs/flappy.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Bird — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #f0f3f6;
      --muted: #8b949e;
      --accent: #8b5cf6;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    a.back {
      position: fixed; top: 1.1rem; left: 1.1rem;
      color: var(--muted); text-decoration: none; font-size: 0.9rem;
      z-index: 10; transition: color 0.2s;
    }
    a.back:hover { color: var(--accent); }
    .hud {
      margin-bottom: 0.85rem; font-size: 1rem;
    }
    .hud span { color: var(--muted); }
    .hud strong { font-weight: 700; font-size: 1.25rem; }
    .board-wrap {
      position: relative;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    canvas {
      display: block;
      max-width: 92vw;
      max-height: 80vh;
      cursor: pointer;
    }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(15,17,23,0.72);
      backdrop-filter: blur(5px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 { font-size: 1.55rem; font-weight: 700; margin-bottom: 0.3rem; }
    .overlay p { color: var(--muted); margin-bottom: 1.1rem; font-size: 0.95rem; }
    .btn {
      padding: 0.6rem 1.5rem;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white; border: none; border-radius: 999px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 20px rgba(139,92,246,0.4);
    }
    .hint { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); opacity: 0.85; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <div class="hud"><span>Score</span> <strong id="score">0</strong></div>
  <div class="board-wrap">
    <canvas id="c" width="400" height="600"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="otitle">Flappy Bird</h2>
      <p id="omsg">Tap or press Space to start</p>
      <button class="btn" id="btn">Play</button>
    </div>
  </div>
  <p class="hint">Click / Tap / Space to flap</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    let bird, pipes, score, frame, started, dead, best;
    const gravity = 0.32;
    const jump = -6.0;
    const gap = 175;
    const pipeW = 48;
    best = +localStorage.getItem('flappy-best') || 0;

    function reset() {
      bird = {x: 90, y: H/2, vy: 0, r: 16, rot: 0};
      pipes = [];
      score = 0;
      frame = 0;
      started = false;
      dead = false;
      document.getElementById('score').textContent = 0;
      show('Flappy Bird', 'Tap or press Space to start');
    }

    function show(t, m) {
      document.getElementById('otitle').textContent = t;
      document.getElementById('omsg').textContent = m;
      document.getElementById('overlay').classList.add('show');
    }
    function hide() { document.getElementById('overlay').classList.remove('show'); }

    function addPipe() {
      const top = 70 + Math.random() * (H - gap - 160);
      pipes.push({x: W + 10, top, bottom: top + gap, passed: false});
    }

    function draw() {
      // sky gradient
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#1a1a2e');
      bg.addColorStop(0.6, '#16213e');
      bg.addColorStop(1, '#0f3460');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // subtle stars
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      for (let i = 0; i < 18; i++) {
        const sx = (i * 97 + frame * 0.15) % W;
        const sy = (i * 53) % (H * 0.55);
        ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI*2); ctx.fill();
      }

      // pipes
      pipes.forEach(p => {
        // top
        const pg = ctx.createLinearGradient(p.x, 0, p.x + pipeW, 0);
        pg.addColorStop(0, '#0891b2');
        pg.addColorStop(0.5, '#22d3ee');
        pg.addColorStop(1, '#06b6d4');
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.roundRect(p.x, 0, pipeW, p.top, [0, 0, 8, 8]);
        ctx.fill();
        // cap
        ctx.fillStyle = '#67e8f9';
        ctx.fillRect(p.x - 3, p.top - 14, pipeW + 6, 14);

        // bottom
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.roundRect(p.x, p.bottom, pipeW, H - p.bottom, [8, 8, 0, 0]);
        ctx.fill();
        ctx.fillStyle = '#67e8f9';
        ctx.fillRect(p.x - 3, p.bottom, pipeW + 6, 14);
      });

      // ground line
      ctx.fillStyle = '#1c2128';
      ctx.fillRect(0, H - 6, W, 6);
      ctx.fillStyle = '#30363d';
      ctx.fillRect(0, H - 6, W, 2);

      // bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rot);
      // body
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 15, 0, 0, Math.PI*2);
      ctx.fill();
      // wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-5, 4, 10, 7, -0.3, 0, Math.PI*2);
      ctx.fill();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(8, -5, 5.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0f1117';
      ctx.beginPath(); ctx.arc(9.5, -5, 2.8, 0, Math.PI*2); ctx.fill();
      // beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(16, 0); ctx.lineTo(25, 3); ctx.lineTo(16, 6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function update() {
      if (!started || dead) return;
      frame++;
      bird.vy += gravity;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI/3, Math.max(-0.5, bird.vy * 0.06));

      if (frame % 110 === 0) addPipe();

      pipes.forEach(p => {
        p.x -= 2.1;
        if (!p.passed && p.x + pipeW < bird.x) {
          p.passed = true;
          score++;
          document.getElementById('score').textContent = score;
        }
      });
      pipes = pipes.filter(p => p.x > -pipeW - 10);

      // collisions
      if (bird.y + bird.r > H - 8 || bird.y - bird.r < 0) {
        die();
        return;
      }
      for (const p of pipes) {
        if (bird.x + bird.r - 4 > p.x && bird.x - bird.r + 4 < p.x + pipeW) {
          if (bird.y - bird.r + 3 < p.top || bird.y + bird.r - 3 > p.bottom) {
            die();
            return;
          }
        }
      }
    }

    function die() {
      dead = true;
      if (score > best) {
        best = score;
        localStorage.setItem('flappy-best', best);
      }
      show('Game Over', `Score: ${score}  ·  Best: ${best}`);
    }

    function flap() {
      if (dead) { reset(); return; }
      if (!started) { started = true; hide(); }
      bird.vy = jump;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive:false});
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); flap(); }
    });
    document.getElementById('btn').addEventListener('click', flap);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
