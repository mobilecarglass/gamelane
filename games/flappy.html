<!--
  title: Flappy Bird
  description: Tap to flap through the pipes. Simple controls, hard to master.
  tags: arcade, endless
  thumbnail: games/thumbs/flappy.svg
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Flappy Bird — GameLane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06080d; color: #f0f3f6; font-family: system-ui, sans-serif; touch-action: none; user-select: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    a.back { position: fixed; top: 12px; left: 12px; color: #8b949e; text-decoration: none; font-size: 0.85rem; z-index: 20; padding: 6px 10px; background: rgba(0,0,0,0.35); border-radius: 8px; backdrop-filter: blur(6px); }
    a.back:hover { color: #a78bfa; }
    .topbar { position: fixed; top: 12px; right: 12px; left: 12px; display: flex; justify-content: center; z-index: 15; pointer-events: none; }
    .topbar .stat { text-align: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
    .topbar span { display: block; font-size: 0.7rem; color: #8b949e; }
    .topbar strong { font-size: 1.4rem; font-weight: 700; }
    #game-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; background: #0a0e17; cursor: pointer; }
    @media (orientation: portrait) { canvas { width: min(100vw, 100%); height: auto; max-height: 100vh; } }
    @media (orientation: landscape) { canvas { height: min(100vh, 100%); width: auto; max-width: 100vw; } }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(6,8,13,0.88); backdrop-filter: blur(12px); opacity: 0; pointer-events: none; transition: opacity 0.3s; text-align: center; padding: 1.5rem; z-index: 10; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .overlay h2 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; margin-bottom: 0.4rem; }
    .overlay p { color: #8b949e; margin-bottom: 1.4rem; }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 0.75rem 2rem; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; border: none; border-radius: 999px; font-size: 1.05rem; font-weight: 600; cursor: pointer; box-shadow: 0 8px 28px rgba(139,92,246,0.5); }
    .btn.secondary { background: transparent; border: 1px solid #30363d; box-shadow: none; color: #e2e8f0; }
    .hint { position: fixed; bottom: 14px; font-size: 0.75rem; color: #6b7280; text-align: center; width: 100%; pointer-events: none; z-index: 5; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← GameLane</a>
  <div class="topbar">
    <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
  </div>
  <div id="game-wrap">
    <canvas id="c" width="420" height="720"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="otitle">Flappy Bird</h2>
      <p id="omsg">Tap or press Space to flap.</p>
      <div class="btn-row">
        <button class="btn" id="btn">Play</button>
        <button class="btn secondary" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>
  <p class="hint">Click / Tap / Space to flap</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = canvas.width, H = canvas.height;

    let bird, pipes, score, frame, started, dead, best;
    const gravity = 0.36, jump = -6.2, gap = 175, pipeW = 54;
    best = +localStorage.getItem('flappy-best') || 0;

    function reset() {
      bird = { x: 100, y: H/2, vy: 0, r: 18, rot: 0 };
      pipes = []; score = 0; frame = 0; started = false; dead = false;
      document.getElementById('score').textContent = 0;
      show('Flappy Bird', 'Tap or press Space to flap.');
    }
    function show(t,m){ document.getElementById('otitle').textContent=t; document.getElementById('omsg').textContent=m; document.getElementById('overlay').classList.add('show'); }
    function hide(){ document.getElementById('overlay').classList.remove('show'); }
    function addPipe(){ const top = 90 + Math.random()*(H-gap-200); pipes.push({x:W+20, top, bottom:top+gap, passed:false}); }

    function draw() {
      const bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,'#0a0e1a'); bg.addColorStop(0.45,'#12102a'); bg.addColorStop(1,'#0a2a3a');
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i=0;i<28;i++) {
        const sx = (i*89 + frame*0.12) % W;
        const sy = (i*47) % (H*0.5);
        ctx.beginPath(); ctx.arc(sx,sy,1.3,0,Math.PI*2); ctx.fill();
      }

      pipes.forEach(p => {
        const pg = ctx.createLinearGradient(p.x,0,p.x+pipeW,0);
        pg.addColorStop(0,'#0e7490'); pg.addColorStop(0.4,'#22d3ee'); pg.addColorStop(1,'#06b6d4');
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.roundRect(p.x,0,pipeW,p.top,[0,0,10,10]); ctx.fill();
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath(); ctx.roundRect(p.x-4,p.top-18,pipeW+8,18,4); ctx.fill();
        ctx.fillStyle = pg;
        ctx.beginPath(); ctx.roundRect(p.x,p.bottom,pipeW,H-p.bottom,[10,10,0,0]); ctx.fill();
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath(); ctx.roundRect(p.x-4,p.bottom,pipeW+8,18,4); ctx.fill();
      });

      ctx.fillStyle = '#0f172a'; ctx.fillRect(0,H-10,W,10);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(0,H-10,W,3);

      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rot);
      const bg2 = ctx.createRadialGradient(0,0,2,0,0,28);
      bg2.addColorStop(0,'rgba(251,191,36,0.25)'); bg2.addColorStop(1,'transparent');
      ctx.fillStyle = bg2; ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.ellipse(0,0,20,16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.ellipse(-6,4,11,8,-0.35,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(9,-5,6.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(11,-5,3.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.moveTo(18,-1); ctx.lineTo(28,3); ctx.lineTo(18,7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function update(step = 1) {
      if (!started || dead) return;
      frame += step;
      bird.vy += gravity * step; bird.y += bird.vy * step;
      bird.rot = Math.min(Math.PI/3.5, Math.max(-0.45, bird.vy*0.055));
      if (frame % 85 === 0) addPipe();
      pipes.forEach(p => {
        p.x -= 2.7 * step;
        if (!p.passed && p.x+pipeW < bird.x) { p.passed = true; score++; document.getElementById('score').textContent = score; }
      });
      pipes = pipes.filter(p => p.x > -pipeW-20);
      if (bird.y+bird.r > H-12 || bird.y-bird.r < 0) { die(); return; }
      for (const p of pipes) {
        if (bird.x+bird.r-5 > p.x && bird.x-bird.r+5 < p.x+pipeW) {
          if (bird.y-bird.r+4 < p.top || bird.y+bird.r-4 > p.bottom) { die(); return; }
        }
      }
    }

    function die() {
      dead = true;
      if (score > best) { best = score; localStorage.setItem('flappy-best', best); }
      show('Game Over', `Score: ${score}  ·  Best: ${best}`);
    }
    function flap() {
      if (dead) { reset(); return; }
      if (!started) { started = true; hide(); }
      bird.vy = jump;
    }
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(32, now - lastTime);
      lastTime = now;
      const step = dt / 16.67;
      update(step);
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive:false});
    window.addEventListener('keydown', e => { if (e.code==='Space'||e.key===' ') { e.preventDefault(); flap(); } });
    document.getElementById('btn').addEventListener('click', flap);
    document.getElementById('fs-btn').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) (el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);
      else (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
    });

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
