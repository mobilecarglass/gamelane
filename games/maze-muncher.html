<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Maze Muncher — GameLane</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06080d;color:#f0f3f6;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
a.back{position:fixed;top:12px;left:12px;color:#8b949e;text-decoration:none;font-size:.85rem;z-index:20;padding:6px 10px;background:rgba(0,0,0,.35);border-radius:8px;backdrop-filter:blur(6px)}
.topbar{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:1.5rem;z-index:15;pointer-events:none}
.stat{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:6px 14px;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.stat span{display:block;font-size:.7rem;color:#8b949e;letter-spacing:.05em}
.stat strong{font-size:1.25rem}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0a0e17;max-width:100vw;max-height:100vh;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,8,13,.9);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10;text-align:center;padding:1.5rem}
.overlay.show{opacity:1;pointer-events:auto}
.overlay h2{font-size:1.6rem;margin-bottom:.35rem}
.overlay p{color:#8b949e;margin-bottom:1.2rem}
.btn{padding:.7rem 1.8rem;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;border:none;border-radius:999px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,.4)}
.hint{position:fixed;bottom:12px;font-size:.75rem;color:#6b7280;width:100%;text-align:center;z-index:5}
</style>
</head>
<body>
<a class="back" href="../index.html">← GameLane</a>
<div class="topbar">
  <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
  <div class="stat"><span>LEFT</span><strong id="left">0</strong></div>
</div>
<div id="wrap">
<canvas id="c" width="420" height="480"></canvas>
<div class="overlay show" id="ov"><h2 id="ot">Maze Muncher</h2><p id="om">Eat all the dots. Avoid ghosts.</p><button class="btn" id="btn">Start Playing</button></div>
</div>
<p class="hint">Arrow keys / WASD / Swipe to move</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CS = 28; // cell size

const MAP = [
  "111111111111111",
  "100000000000001",
  "101111011111101",
  "100000000000001",
  "101101111011101",
  "100100000001001",
  "111101111011111",
  "100000000000001",
  "101111011111101",
  "100000000000001",
  "111111111111111"
];
const rows = MAP.length, cols = MAP[0].length;
canvas.width = cols * CS;
canvas.height = rows * CS;

let player, ghosts, dots, score, started, dead, won, dir, nextDir;
// Time-based so speed matches on 60Hz phones and 120Hz desktops
const PLAYER_MOVE_MS = 530;  // ~same feel as 32 frames @ 60fps
const GHOST_MOVE_MS = 770;   // ~same feel as 46 frames @ 60fps
let playerAcc = 0, ghostAcc = 0, lastTime = 0;

function reset() {
  player = { x: 1, y: 1 };
  dir = { x: 0, y: 0 };
  nextDir = { x: 0, y: 0 };
  ghosts = [
    { x: 13, y: 1, c: '#f472b6' },
    { x: 13, y: 9, c: '#22d3ee' },
    { x: 7, y: 5, c: '#a78bfa' }
  ];
  dots = [];
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++)
      if (MAP[y][x] === '0') dots.push({ x, y });
  score = 0;
  started = false;
  dead = false;
  won = false;
  playerAcc = 0;
  ghostAcc = 0;
  lastTime = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('left').textContent = dots.length;
  show('Maze Muncher', 'Eat all the dots. Avoid ghosts.');
}

function show(t, m) {
  document.getElementById('ot').textContent = t;
  document.getElementById('om').textContent = m;
  document.getElementById('ov').classList.add('show');
}
function hide() { document.getElementById('ov').classList.remove('show'); }
function wall(x, y) {
  return y < 0 || x < 0 || y >= rows || x >= cols || MAP[y][x] === '1';
}

function draw() {
  ctx.fillStyle = '#0a0e17';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Walls with subtle depth
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (MAP[y][x] === '1') {
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(x * CS, y * CS, CS, CS);
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x * CS + 2, y * CS + 2, CS - 4, CS - 4);
      }
    }
  }

  // Dots
  dots.forEach(d => {
    ctx.fillStyle = '#ffd978';
    ctx.beginPath();
    ctx.arc(d.x * CS + CS / 2, d.y * CS + CS / 2, 3.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Player
  const px = player.x * CS + CS / 2;
  const py = player.y * CS + CS / 2;
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(px, py, CS * 0.38, 0, Math.PI * 2);
  ctx.fill();
  // Eye direction hint
  if (dir.x || dir.y) {
    ctx.fillStyle = '#0a0e17';
    const ox = dir.x * 5, oy = dir.y * 5;
    ctx.beginPath();
    ctx.arc(px + ox - 3, py + oy - 2, 2.5, 0, Math.PI * 2);
    ctx.arc(px + ox + 3, py + oy - 2, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ghosts
  ghosts.forEach(g => {
    const gx = g.x * CS + CS / 2;
    const gy = g.y * CS + CS / 2;
    ctx.fillStyle = g.c;
    ctx.beginPath();
    ctx.arc(gx, gy, CS * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(gx - 5, gy - 3, 4, 0, Math.PI * 2);
    ctx.arc(gx + 5, gy - 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0e17';
    ctx.beginPath();
    ctx.arc(gx - 4, gy - 2, 2, 0, Math.PI * 2);
    ctx.arc(gx + 6, gy - 2, 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function movePlayer() {
  const nd = nextDir;
  if (!wall(player.x + nd.x, player.y + nd.y)) dir = { ...nd };
  if (!wall(player.x + dir.x, player.y + dir.y)) {
    player.x += dir.x;
    player.y += dir.y;
  }
  dots = dots.filter(d => {
    if (d.x === player.x && d.y === player.y) {
      score += 10;
      document.getElementById('score').textContent = score;
      return false;
    }
    return true;
  });
  document.getElementById('left').textContent = dots.length;
  if (dots.length === 0) {
    won = true;
    show('Clear!', 'Score: ' + score);
  }
  for (const g of ghosts) {
    if (g.x === player.x && g.y === player.y) {
      dead = true;
      show('Caught!', 'Score: ' + score);
      return;
    }
  }
}

function moveGhosts() {
  ghosts.forEach(g => {
    const opts = [
      { x: 1, y: 0 }, { x: -1, y: 0 },
      { x: 0, y: 1 }, { x: 0, y: -1 }
    ].filter(o => !wall(g.x + o.x, g.y + o.y));
    if (!opts.length) return;
    opts.sort((a, b) => {
      const da = Math.abs(g.x + a.x - player.x) + Math.abs(g.y + a.y - player.y);
      const db = Math.abs(g.x + b.x - player.x) + Math.abs(g.y + b.y - player.y);
      return da - db;
    });
    const pick = Math.random() < 0.6 ? opts[0] : opts[Math.floor(Math.random() * opts.length)];
    g.x += pick.x;
    g.y += pick.y;
    if (g.x === player.x && g.y === player.y) {
      dead = true;
      show('Caught!', 'Score: ' + score);
    }
  });
}

function update(dt) {
  if (!started || dead || won) return;
  playerAcc += dt;
  ghostAcc += dt;
  while (playerAcc >= PLAYER_MOVE_MS) {
    playerAcc -= PLAYER_MOVE_MS;
    movePlayer();
    if (dead || won) return;
  }
  while (ghostAcc >= GHOST_MOVE_MS) {
    ghostAcc -= GHOST_MOVE_MS;
    moveGhosts();
    if (dead || won) return;
  }
}

function loop(now) {
  if (!lastTime) lastTime = now;
  const dt = Math.min(50, now - lastTime); // cap so tab-switch doesn't jump
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function start() {
  if (dead || won) reset();
  started = true;
  hide();
}

// Keyboard
const km = {
  ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
  a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
};
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (km[k]) {
    e.preventDefault();
    nextDir = km[k];
  }
  if (!started || dead || won) start();
});

// --- Improved mobile swipe ---
const SWIPE_MIN = 28; // minimum pixels to count as a swipe
let touchStartX = 0, touchStartY = 0;
let touchActive = false;
let lastSwipeDir = null;

function applySwipe(dx, dy) {
  if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return false;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) {
    nd = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
  } else {
    nd = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
  }
  // Avoid repeating the same direction spam from tiny adjustments
  if (lastSwipeDir && lastSwipeDir.x === nd.x && lastSwipeDir.y === nd.y) {
    // still apply — player may want to keep going that way after a wall
  }
  nextDir = nd;
  lastSwipeDir = nd;
  return true;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchActive = true;
  lastSwipeDir = null;
  if (!started || dead || won) start();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchActive) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  // Apply as soon as swipe is clear enough (responsive)
  if (applySwipe(dx, dy)) {
    // Reset start so continuous dragging can change direction again
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touchActive) return;
  touchActive = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  applySwipe(dx, dy);
}, { passive: false });

canvas.addEventListener('touchcancel', () => {
  touchActive = false;
});

// Also allow click on canvas to start
canvas.addEventListener('click', () => {
  if (!started || dead || won) start();
});

document.getElementById('btn').onclick = start;
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
