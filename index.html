<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameLane — Play Instantly</title>
  <meta name="description" content="A collection of free browser games. No downloads, no accounts — just play." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --bg-elevated: #161b22;
      --bg-card: #1c2128;
      --bg-card-hover: #242b35;
      --border: #30363d;
      --border-hover: #484f58;
      --text: #f0f3f6;
      --text-muted: #8b949e;
      --accent: #8b5cf6;
      --accent-soft: rgba(139, 92, 246, 0.15);
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-2: #22d3ee;
      --success: #3fb950;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 12px 40px rgba(0,0,0,0.35);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ========== Background effects ========== */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: -2;
      mask-image: radial-gradient(ellipse 90% 70% at 50% -10%, black 10%, transparent 75%);
    }

    .bg-glow {
      position: fixed;
      top: -25%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 550px;
      background: radial-gradient(ellipse, rgba(139, 92, 246, 0.18) 0%, rgba(34, 211, 238, 0.08) 40%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* ========== Layout ========== */
    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* ========== Header ========== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      border-radius: 8px;
      font-size: 0.75rem;
      color: white;
    }

    .logo-text span {
      color: var(--accent);
    }

    .search-wrap {
      position: relative;
      width: min(280px, 50vw);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 0.55rem 0.9rem 0.55rem 2.4rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #search::placeholder {
      color: var(--text-muted);
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* ========== Hero ========== */
    .hero {
      padding: 3.5rem 0 2.5rem;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      max-width: 420px;
      margin: 0 auto;
    }

    /* ========== Games section ========== */
    .games-section {
      padding-bottom: 5rem;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;
    }

    .section-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .game-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .filter-btn {
      padding: 0.4rem 0.95rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* ========== Games Grid — auto-arranges on resize ========== */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: 1.25rem;
    }

    /* Card */
    .game-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow), 0 0 0 1px var(--accent-glow);
    }

    .game-thumb {
      aspect-ratio: 16 / 10;
      background: linear-gradient(145deg, #1c2128, #161b22);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-thumb .placeholder {
      font-size: 2.5rem;
      opacity: 0.35;
    }

    .game-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,17,23,0.75) 0%, transparent 55%);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .game-card:hover .game-thumb::after {
      opacity: 1;
    }

    .play-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 0.85rem;
      opacity: 0;
      transform: scale(0.8);
      transition: all var(--transition);
      z-index: 2;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .game-card:hover .play-badge {
      opacity: 1;
      transform: scale(1);
    }

    .game-info {
      padding: 1rem 1.1rem 1.15rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .game-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .game-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.2rem 0.55rem;
      background: var(--accent-soft);
      color: #c4b5fd;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    /* ========== Footer ========== */
    .footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .footer-note {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .footer code {
      background: var(--bg-card);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8em;
    }

    /* ========== Responsive ========== */
    @media (max-width: 640px) {
      .header-inner {
        height: 56px;
      }

      .hero {
        padding: 2.5rem 0 1.75rem;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .search-wrap {
        width: min(200px, 45vw);
      }
    }

    @media (min-width: 641px) and (max-width: 900px) {
      .games-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
    }

    .games-grid,
    .game-card,
    .filter-btn {
      transition: all 0.25s ease;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">Game<span>Lane</span></span>
      </a>
      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="search" id="search" placeholder="Search games..." autocomplete="off" />
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Play instantly.<br/><span>No downloads.</span></h1>
        <p class="hero-sub">Free browser games that just work. Click and play.</p>
      </div>
    </section>

    <section class="games-section">
      <div class="container">
        <div class="section-header">
          <h2>All Games</h2>
          <span class="game-count" id="game-count">0 games</span>
        </div>

        <div class="filters" id="filters">
          <button class="filter-btn active" data-tag="all">All</button>
        </div>

        <div class="games-grid" id="games-grid"></div>

        <div class="empty-state" id="empty-state" hidden>
          <p>No games match your search.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>GameLane — free browser games</p>
      <p class="footer-note">Drop a single .html file into <code>/games</code> and it appears automatically.</p>
    </div>
  </footer>

  <script>
    // GameLane – loads games automatically from games.json
    // Run `node scan-games.js` after adding/removing games

    let allGames = [];
    let activeTag = "all";
    let searchQuery = "";

    async function init() {
      try {
        const res = await fetch("games.json");
        if (!res.ok) throw new Error("games.json not found");
        allGames = await res.json();
      } catch (err) {
        console.warn("Could not load games.json – using empty list. Run: node scan-games.js");
        allGames = [];
      }
      renderFilters();
      renderGames();
      setupListeners();
    }

    function getAllTags() {
      const set = new Set();
      allGames.forEach(g => (g.tags || []).forEach(t => set.add(t)));
      return Array.from(set).sort();
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function getEmoji(tags = []) {
      const map = {
        arcade: "👾", classic: "🕹️", puzzle: "🧩", casual: "☕",
        endless: "♾️", action: "💥", strategy: "🧠", racing: "🏎️", sports: "⚽"
      };
      for (const t of tags) if (map[t]) return map[t];
      return "🎮";
    }

    function renderFilters() {
      const container = document.getElementById("filters");
      const tags = getAllTags();
      container.innerHTML =
        '<button class="filter-btn active" data-tag="all">All</button>' +
        tags.map(t => '<button class="filter-btn" data-tag="' + t + '">' + capitalize(t) + '</button>').join("");
      container.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          container.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          activeTag = btn.dataset.tag;
          renderGames();
        });
      });
    }

    function renderGames() {
      const grid = document.getElementById("games-grid");
      const empty = document.getElementById("empty-state");
      const countEl = document.getElementById("game-count");

      let filtered = allGames;

      if (activeTag !== "all") {
        filtered = filtered.filter(g => (g.tags || []).includes(activeTag));
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(g =>
          g.title.toLowerCase().includes(q) ||
          (g.description || "").toLowerCase().includes(q) ||
          (g.tags || []).some(t => t.includes(q))
        );
      }

      countEl.textContent = filtered.length + " game" + (filtered.length !== 1 ? "s" : "");

      if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.hidden = false;
        return;
      }

      empty.hidden = true;

      grid.innerHTML = filtered.map(game => {
        const thumb = game.thumbnail
          ? '<img src="' + game.thumbnail + '" alt="' + escapeHtml(game.title) + '" loading="lazy" />'
          : '<span class="placeholder">' + getEmoji(game.tags) + '</span>';
        const desc = game.description ? '<p class="game-desc">' + escapeHtml(game.description) + '</p>' : "";
        const tags = (game.tags && game.tags.length)
          ? '<div class="game-tags">' + game.tags.map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join("") + '</div>'
          : "";
        return (
          '<a class="game-card" href="' + game.url + '" target="_blank" rel="noopener">' +
            '<div class="game-thumb">' + thumb + '<div class="play-badge">▶</div></div>' +
            '<div class="game-info">' +
              '<h3 class="game-title">' + escapeHtml(game.title) + '</h3>' +
              desc + tags +
            '</div>' +
          '</a>'
        );
      }).join("");
    }

    function setupListeners() {
      const search = document.getElementById("search");
      let debounce;
      search.addEventListener("input", () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => {
          searchQuery = search.value.trim();
          renderGames();
        }, 180);
      });
    }

    init();
  </script>
</body>
</html>
